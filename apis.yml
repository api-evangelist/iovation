name: iovation
description: >-
  iovation is a device-intelligence and online fraud-prevention service acquired
  by TransUnion in 2018 and now delivered as TransUnion TruValidate Device Risk
  (the SDK was formerly branded "FraudForce"). It fingerprints web and mobile
  devices into an encrypted "blackbox," evaluates it against a shared reputation
  database of billions of devices plus configurable rulesets, and returns a
  transaction risk assessment. Device data is collected client-side with
  first-party JavaScript and native iOS/Android SDKs; server-side integration is
  a SOAP CheckTransactionDetails call over HTTPS. iovation is used for account
  takeover, new-account fraud, payment fraud, and bot detection.
